<!doctype html>
<html><head><meta charset="utf-8"><title>Hover Bots Prototype</title>
<style>html,body{margin:0;background:#0b0d1a;overflow:hidden}canvas{display:block}
#ui{position:fixed;top:14px;left:18px;color:#cfe;font:14px system-ui}</style></head>
<body><div id="ui"><b>HOVER BOTS</b> · WASD / arrows to drive · 1 = Magma · 2 = Jade</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),g=c.getContext('2d');
function rs(){c.width=innerWidth;c.height=innerHeight}rs();addEventListener('resize',rs);
const TW=64,TH=32,N=14;
const P=(x,y,z=0)=>[(x-y)*TW/2+c.width/2,(x+y)*TH/2+c.height*0.22-z*TH];
function shade(h,l){const n=parseInt(h.slice(1),16);let r=(n>>16)&255,gg=(n>>8)&255,b=n&255;
 return `rgb(${Math.min(255,r*l)|0},${Math.min(255,gg*l)|0},${Math.min(255,b*l)|0})`}
function poly(pts,fill,stroke){g.beginPath();pts.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.closePath();g.fillStyle=fill;g.fill();if(stroke){g.strokeStyle=stroke;g.stroke()}}
function box(x,y,z,w,d,h,col,glow){
 if(glow){g.shadowColor=col;g.shadowBlur=18}
 poly([P(x,y,z+h),P(x+w,y,z+h),P(x+w,y+d,z+h),P(x,y+d,z+h)],shade(col,1.15));
 g.shadowBlur=0;
 poly([P(x,y+d,z+h),P(x+w,y+d,z+h),P(x+w,y+d,z),P(x,y+d,z)],shade(col,.7));
 poly([P(x+w,y,z+h),P(x+w,y+d,z+h),P(x+w,y+d,z),P(x+w,y,z)],shade(col,.5));
}
const paints={magma:{a:'#ff5a1f',b:'#ffd23f'},jade:{a:'#17c27a',b:'#b6ffd9'}};
function bot(x,y,paint,t){
 const p=paints[paint],hover=.35+Math.sin(t*3+x)*.05;
 // shadow
 poly([P(x-.1,y-.1),P(x+1.1,y-.1),P(x+1.1,y+1.1),P(x-.1,y+1.1)],'rgba(0,0,0,.35)');
 box(x,y,hover,1,1,.35,p.a);            // hull
 box(x+.2,y+.2,hover+.35,.6,.6,.3,p.b,true); // glowing core
 box(x+.75,y+.4,hover+.4,.9,.2,.18,'#2a2f4a'); // barrel
 // hover pad glow
 g.save();g.globalAlpha=.6;g.shadowColor=p.b;g.shadowBlur=25;
 poly([P(x+.1,y+.1,hover-.05),P(x+.9,y+.1,hover-.05),P(x+.9,y+.9,hover-.05),P(x+.1,y+.9,hover-.05)],p.b);g.restore();
}
const me={x:4,y:5,paint:'magma'},foe={x:9,y:8,paint:'jade'};
const k={};addEventListener('keydown',e=>{k[e.key.toLowerCase()]=1;if(e.key=='1')me.paint='magma';if(e.key=='2')me.paint='jade'});
addEventListener('keyup',e=>k[e.key.toLowerCase()]=0);
const blocks=[[2,2,1.2],[6,3,.8],[10,5,1.6],[3,10,1],[8,11,1.3],[11,10,.7],[6,7,.5]];
function draw(t){
 g.fillStyle='#0b0d1a';g.fillRect(0,0,c.width,c.height);
 const s=.06;
 if(k.w||k.arrowup){me.x-=s;me.y-=s}if(k.s||k.arrowdown){me.x+=s;me.y+=s}
 if(k.a||k.arrowleft){me.x-=s;me.y+=s}if(k.d||k.arrowright){me.x+=s;me.y-=s}
 me.x=Math.max(0,Math.min(N-1,me.x));me.y=Math.max(0,Math.min(N-1,me.y));
 foe.x=9+Math.sin(t*.7)*1.5;foe.y=8+Math.cos(t*.5)*1.5;
 for(let i=0;i<N;i++)for(let j=0;j<N;j++){
  const l=(i+j)%2?'#1a2040':'#232b55';
  poly([P(i,j),P(i+1,j),P(i+1,j+1),P(i,j+1)],l,'#2f3a75');}
 // neon edge
 g.save();g.shadowColor='#6cf';g.shadowBlur=20;g.strokeStyle='#6cf';g.lineWidth=2;
 g.beginPath();[P(0,0),P(N,0),P(N,N),P(0,N)].forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.closePath();g.stroke();g.restore();
 const items=blocks.map(b=>({d:b[0]+b[1],f:()=>box(b[0],b[1],0,1.4,1.4,b[2],'#7a5cff')}));
 items.push({d:me.x+me.y,f:()=>bot(me.x,me.y,me.paint,t)});
 items.push({d:foe.x+foe.y,f:()=>bot(foe.x,foe.y,foe.paint,t)});
 items.sort((a,b)=>a.d-b.d).forEach(o=>o.f());
 requestAnimationFrame(t=>draw(t/1000));
}
draw(0);
</script></body></html>
